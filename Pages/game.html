<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Main</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Style/style.css">
    <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<div class="Container">
    <div class="BackButton">
        <a href="../index.html">В меню</a>
    </div>
    <div class="gameWrapper">
        <div class="GameHud">
            <span class="GameHudLevel" id="hudLevel"></span>
            <span id="hudDeaths"></span>
            <span id="hudTime"></span>
        </div>
        <canvas id="game" width="600" height="600"></canvas>
        <div class="GameHint">← → — бег, ↑ или пробел — прыжок, R — начать уровень заново</div>
        <div class="TouchControls">
            <div class="TouchGroup">
                <button class="TouchButton" data-key="ArrowLeft" aria-label="Влево">
                    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
                </button>
                <button class="TouchButton" data-key="ArrowRight" aria-label="Вправо">
                    <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
                </button>
            </div>
            <button class="TouchButton" data-key="ArrowUp" aria-label="Прыжок">
                <svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg>
            </button>
        </div>
        <script src="../JS/game.js"></script>
    </div>
    <div class="Name">
        Багаев Дмитрий, 223-ZИС
    </div>
</div>
</body>
</html>
